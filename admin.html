<!DOCTYPE html>
<html lang="en-IN"><head><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1" name="viewport"/><title>SURYONIC ENERGY | Admin</title><link href="style.css" rel="stylesheet"/><meta content="" name="description"/><meta content="noindex, nofollow" name="robots"/><meta content="SURYONIC ENERGY" name="author"/><meta content="#0b2b4b" name="theme-color"/><link href="https://suryonicenergy-droid.github.io/suryonicenergy/admin.html" rel="canonical"/><meta content="website" property="og:type"/><meta content="SURYONIC ENERGY | Admin" property="og:title"/><meta content="" property="og:description"/><meta content="https://suryonicenergy-droid.github.io/suryonicenergy/admin.html" property="og:url"/><meta content="https://suryonicenergy-droid.github.io/suryonicenergy/assets/logo.png" property="og:image"/><meta content="SURYONIC ENERGY" property="og:site_name"/><meta content="en_IN" property="og:locale"/><meta content="summary_large_image" name="twitter:card"/><meta content="SURYONIC ENERGY | Admin" name="twitter:title"/><meta content="" name="twitter:description"/><meta content="https://suryonicenergy-droid.github.io/suryonicenergy/assets/logo.png" name="twitter:image"/><link href="assets/logo.png" rel="icon" type="image/png"/></head><body><header><div class="wrap nav"><a href="index.html"><img alt="SURYONIC ENERGY Logo" class="brand-logo" loading="lazy" src="assets/logo.png"/></a><nav class="menu" style="display:flex"><a href="index.html">Website</a><a href="reviews.html">Reviews</a></nav></div></header><main><section class="page-head"><div class="wrap"><span class="pill">ADMIN</span><h1>Review Approval</h1><p class="lead" style="margin-left:0">Local/static website approval panel. For a real multi-device secure admin system, connect Firebase/Supabase or another backend.</p></div></section><section class="section"><div class="wrap"><div class="contact-box"><div id="login"><h2>Admin Access</h2><input class="field" id="adminPass" placeholder="Admin password" type="password"/><button class="btn" onclick="loginAdmin()">Open Dashboard</button><p class="small">Demo password for this static package: <strong>SURYONIC-ADMIN</strong></p></div><div id="dash" style="display:none"><div class="stats"><div class="stat"><b id="pendingCount">0</b>Pending</div><div class="stat"><b id="approvedCount">0</b>Approved</div><div class="stat"><b id="rejectedCount">0</b>Rejected</div></div><h2 style="margin-top:35px">Submitted Reviews</h2><div id="adminReviews"></div></div></div></div></section></main><script src="app.js"></script><script>function loginAdmin(){if(document.getElementById('adminPass').value!=='SURYONIC-ADMIN'){alert('Wrong password');return}document.getElementById('login').style.display='none';document.getElementById('dash').style.display='block';renderAdmin()}function renderAdmin(){const a=getReviews(),box=document.getElementById('adminReviews');document.getElementById('pendingCount').textContent=a.filter(x=>x.status==='pending').length;document.getElementById('approvedCount').textContent=a.filter(x=>x.status==='approved').length;document.getElementById('rejectedCount').textContent=a.filter(x=>x.status==='rejected').length;box.innerHTML=a.length?a.map(r=>`<div class="admin-row"><div>${r.photo?`<img src="${r.photo}" alt="Customer">`:'<div class="notice">No photo</div>'}</div><div><b>${escapeHTML(r.name)}</b> • ${escapeHTML(r.location)}<div class="stars">${'★'.repeat(r.rating)}${'☆'.repeat(5-r.rating)}</div><p>${escapeHTML(r.text)}</p><small>${new Date(r.createdAt).toLocaleString()}</small></div><div class="admin-actions"><button class="btn" onclick="setStatus(${r.id},'approved')">Approve</button><button class="btn outline" onclick="setStatus(${r.id},'rejected')">Reject</button></div></div>`).join(''):'<div class="notice">No reviews submitted yet.</div>'}function setStatus(id,status){const a=getReviews().map(r=>r.id===id?{...r,status}:r);localStorage.setItem('suryonicReviews',JSON.stringify(a));renderAdmin()}</script></body></html>
